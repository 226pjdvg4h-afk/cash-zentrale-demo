:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#020711;color:#f4faff}button{font:inherit;color:inherit;cursor:pointer}.app{max-width:470px;margin:auto;position:relative;min-height:100svh;overflow:hidden;background:#03101d}.brand{position:absolute;z-index:6;left:0;right:0;top:calc(env(safe-area-inset-top) + 23px);text-align:center;pointer-events:none;font:normal clamp(28px,8vw,39px) Georgia,serif;letter-spacing:-1.8px;text-shadow:0 3px 19px #000}.brand b{color:#f4d49a;font-weight:normal}.scene{height:100svh;min-height:720px;max-height:1050px;position:relative;background:radial-gradient(ellipse at 55% 47%,#123f69 0,#08213a 30%,#030a1b 65%,#010711 100%)}.scene:after{content:"";position:absolute;inset:0;z-index:0;background-image:radial-gradient(#c7efff 1px,transparent 1px),radial-gradient(#ffe3aa .9px,transparent 1px);background-size:61px 79px,92px 123px;background-position:17px 24px,44px 73px;opacity:.45;mask-image:linear-gradient(#000 10%,#0008 72%,transparent)}.cosmos{position:absolute;z-index:1;inset:10% 0 19%;width:100%;height:71%;filter:drop-shadow(0 0 10px #6bbfe739)}.world{position:absolute;z-index:4;border:0;padding:0;background:transparent;text-align:center;filter:drop-shadow(0 0 12px #45b2f488);transition:transform .18s ease}.world:active{transform:scale(.96)}.world:focus-visible{outline:2px solid #baf8f5;border-radius:50%}.orb{display:block;position:relative;margin:auto;border-radius:50%;overflow:hidden;border:1px solid #d2f5f9a3;box-shadow:inset -15px -17px 23px #020817bb,inset 7px 7px 14px #ffffff5e,0 0 16px #2eabef84;background:radial-gradient(circle at 30% 21%,#fff2cb 0,#d4d6a2 9%,#3b8c73 23%,#173e82 45%,#112d4d 70%,#03091d 95%)}.orb:before{content:"";position:absolute;inset:18% -18% -29%;border-radius:50%;background:radial-gradient(ellipse at 55% 20%,#adfa67c9 0,#2ba76d88 17%,#0c4e7b66 42%,transparent 67%);transform:rotate(-18deg);filter:bl in:15px 0 6px}.sheet strong{font-size:35px}.sheet p{font-size:13px;line-height:1.5;color:#c5dae2}.sheet .disclaim{font-size:11px;color:#a7d0c6}.screen-only{position:absolute;left:-10000px}@media(min-width:600px){.app{box-shadow:0 0 80px #000;border-left:1px solid #ffffff29;border-right:1px solid #ffffff29}}@media(max-height:700px){.scene{min-height:620px}.kpi{bottom:74px}}@media(prefers-reduced-motion:reduce){.sheet{transition:none}}
 .sheet{max-height:calc(100svh - 140px);overflow-y:auto;overscroll-behavior:contain}.sheet p{clear:both}.sheet .fields{display:grid;gap:9px}.sheet label{display:block;font-size:12px;color:#c5dae2;margin:10px 0}.sheet input,.sheet select{display:block;width:100%;padding:11px;margin-top:5px;background:#081c2b;border:1px solid #6bafbb;border-radius:8px;color:#f4faff;font-size:16px}.sheet .action,.sheet .mini{float:none;width:auto;height:auto;border-radius:8px;padding:9px 12px;margin:6px 4px 6px 0;font-size:12px}.sheet .line{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #ffffff22;font-size:12px}.sheet .line span{overflow-wrap:anywhere;min-width:0}.sheet .line b{white-space:nowrap}.sheet .line small{color:#a2bac6}.sheet .note{font-size:11px;color:#a7d0c6}.sheet .results{max-height:33svh;overflow:auto} </style></head><body><main class="app"><div class="scene"><div class="brand">ca<b>$</b>h zentrale</div><div class="shield">DESIGN 2.1 · LOKALER FUNKTIONSTEST</div>
<svg class="cosmos" viewBox="0 0 420 720" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><radialGradient id="gl"><stop stop-color="#479bd5" stop-opacity=".45"/><stop offset="1" stop-color="#0b2042" stop-opacity="0"/></radialGradient><linearGradient id="cl" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f2d78e"/><stop offset=".35" stop-color="#77fbd5"/><stop offset=".8" stop-color="#5586fa"/></linearGradient><filter id="blur"><feGaussianBlur stdDeviation="9"/></filter></defs><ellipse cx="205" cy="327" rx="210" ry="300" fill="url(#gl)"/><path d="M55 650Q170 533 199 497T346 588" fill="none" stroke="#4bd9d3" stroke-width="57" opacity=".18" filter="url(#blur)"/><path d="M46 651Q170 534 199 497T360 598" fill="none" stroke="url(#cl)" stroke-width="3" opacity=".8"/><path d="M0 595Q110 510 181 590T420 562" fill="none" stroke="#4f88af" opacity=".6"/><path d="M0 641Q133 560 228 651T420 607" fill="none" stroke="#50b8be" opacity=".55"/><g fill="#c5f9ff" opacity=".7"><circle cx="56" cy="51" r="2"/><circle cx="311" cy="61" r="2"/><circle cx="377" cy="180" r="1.5"/><circle cx="22" cy="297" r="1"/><circle cx="390" cy="340" r="2"/><circle cx="79" cy="432" r="1.5"/><circle cx="365" cy="497" r="1.5"/></g></svg>

<div class="sheet" id="detail" role="dialog" aria-modal="false" aria-labelledby="detailtitle"><button id="close" aria-label="Schließen">×</button><small id="detailmeta">FINANZWELT</small><h2 id="detailtitle"></h2><strong id="detailvalue"></strong><p id="detailtext"></p><p class="disclaim">Lokale Sitzung · keine automatische Kontosynchronisierung.</p></div>
</div></main><script>
const sheet=document.getElementById("detail");
const title=document.getElementById("detailtitle"), value=document.getElementById("detailvalue"), body=document.getElementById("detailtext"), meta=document.getElementById("detailmeta");
const state={rows:[],balances:{},holdings:[],screen:"home",month:"",filter:"",includeTransfers:false};
const euro=n=>new Intl.NumberFormat("de-DE",{style:"currency",currency:"EUR"}).format(n);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateISO=s=>{const m=String(s||"").match(/^(\d{2})\.(\d{2})\.(\d{4})/);return m?m[3]+"-"+m[2]+"-"+m[1]:""};
const amount=s=>Number(String(s||"").replace(/[^\d,.-]/g,"").replace(/\./g,"").replace(",","."));
function csvRows(s){const out=[];let row=[],field="",quoted=false; s=s.replace(/^\uFEFF/,"");for(let i=0;i<s.length;i++){const c=s[i];if(c==='"'){if(quoted&&s[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===","&&!quoted){row.push(field);field=""}else if((c==="\n"||c==="\r")&&!quoted){if(c==="\r"&&s[i+1]==="\n")i++;row.push(field);if(row.some(x=>x!==""))out.push(row);row=[];field=""}else field+=c}if(field||row.length){row.push(field);out.push(row)}return out}
function parseCSV(s){const lines=csvRows(s);if(!lines.length)throw Error("Leere CSV");const cols=lines.shift().map(x=>x.trim());const ix=n=>cols.indexOf(n);for(const c of ["Buchungsdatum","Betrag","Kategorie"])if(ix(c)<0)throw Error("Spalte fehlt: "+c);const parsed=lines.map(r=>{const d=dateISO(r[ix("Buchungsdatum")]);const a=amount(r[ix("Betrag")]);return {date:d,amount:a,category:r[ix("Kategorie")]||"Unkategorisiert",name:r[ix("Zahlungsempfänger")]||r[ix("Beschreibung")]||r[ix("Verwendungszweck")]||"Buchung",type:r[ix("Transaktionstyp")]||"",account:r[ix("Kontoname")]||""}}).filter(x=>x.date&&Number.isFinite(x.amount));if(!parsed.length)throw Error("Keine gültigen Buchungen");return parsed.sort((a,b)=>b.date.localeCompare(a.date))}
function transfer(r){return /(?:eigenübertrag|umbuchung|kontotransfer|interner transfer)/i.test(r.category+" "+r.type)||/trade republic|c24 bank|eigenkonto|n26/i.test(r.name)}
function usable(){return state.rows.filter(r=>state.includeTransfers||!transfer(r))}
function months(){return [...new Set(usable().map(r=>r.date.slice(0,7)))].sort().reverse()}
function selected(){return usable().filter(r=>r.date.startsWith(state.month))}
function totals(rows){return rows.reduce((a,r)=>{if(r.amount>=0)a.income+=r.amount;else a.expense-=r.amount;return a},{income:0,expense:0})}
function control(t){return '<button class="action" type="button" data-action="'+t[0]+'">'+t[1]+'</button>'}
function render(k){state.screen=k;document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.screen===k));if(k==="home"){sheet.classList.remove("open");return}sheet.classList.add("open");meta.textContent="CA$H ZENTRALE · LOKALE SITZUNG";title.textContent=({cash:"Liquidität",invest:"Investments",flow:"Cashflow",analytics:"Analyse",future:"Zukunft",lab:"Lab"})[k]||k;let out="";value.textContent="";const ts=totals(selected());const has=state.rows.length>0;
if(k==="cash"){const sum=Object.values(state.balances).reduce((a,b)=>a+b,0);value.textContent=Object.keys(state.balances).length?euro(sum):"–";out='<p>Verfügbares Cash aus manuell eingegebenen Kontoständen. Keine Bankverbindung.</p><div class="fields"><label>C24 Kontostand (€)<input id="bal-c24" inputmode="decimal" placeholder="Nicht eingegeben" value="'+esc(state.balances.C24??"")+'"></label><label>Trade Republic Cash (€)<input id="bal-tr" inputmode="decimal" placeholder="Nicht eingegeben" value="'+esc(state.balances.TR??"")+'"></label></div>'+control(["balances","Kontostände übernehmen"])+'<p class="note">Die Beträge gelten nur für diese Sitzung. Eine echte aktuelle Cash-Position kann aus der Transaktionsliste allein nicht sicher bestimmt werden.</p>'}
if(k==="flow"){value.textContent=has?euro(ts.income-ts.expense):"–";out=has?'<p>Ausgewählter Monat: '+esc(state.month)+'</p><p>Einnahmen: '+euro(ts.income)+'<br>Ausgaben: '+euro(ts.expense)+'</p>'+monthControl()+control(["transfers",state.includeTransfers?"Eigenüberträge berücksichtigen: AN":"Eigenüberträge berücksichtigen: AUS"]):needImport()}
if(k==="analytics"){value.textContent=has?euro(ts.expense):"–";const cat={};for(const r of selected())if(r.amount<0)cat[r.category]=(cat[r.category]||0)-r.amount;out=has?monthControl()+'<p>Ausgaben nach Kategorie:</p><div class="results">'+Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,16).map(([c,n])=>'<div class="line"><span>'+esc(c)+'</span><b>'+euro(n)+'</b></div>').join("")+'</div><label>Transaktionen durchsuchen<input id="txfilter" placeholder="Empfänger oder Kategorie" value="'+esc(state.filter)+'"></label>'+control(["find","Suchen"])+'<div class="results">'+selected().filter(r=>!state.filter||(r.name+" "+r.category).toLowerCase().includes(state.filter.toLowerCase())).slice(0,40).map(r=>'<div class="line"><span>'+esc(r.date.slice(8,10)+"."+r.date.slice(5,7)+". "+r.name)+'<small> '+esc(r.category)+'</small></span><b>'+euro(r.amount)+'</b></div>').join("")+'</div>':needImport()}
if(k==="future"){const last=months().slice(0,6);const stats=last.map(m=>totals(usable().filter(r=>r.date.startsWith(m))));const avg=stats.length?stats.reduce((a,b)=>a+b.income-b.expense,0)/stats.length:0;const cash=Object.values(state.balances).reduce((a,b)=>a+b,0);value.textContent=last.length?euro(avg)+"/Monat":"–";out=last.length?'<p>Historischer Durchschnitt aus '+last.length+' vorhandenen Monaten, keine sichere Vorhersage.</p><div class="results">'+[1,2,3,4,5,6].map(n=>'<div class="line"><span>Monat +'+n+'</span><b>'+(Object.keys(state.balances).length?euro(cash+n*avg):"Cash-Basis fehlt")+'</b></div>').join("")+'</div><p class="note">Sondereffekte, Gehaltsänderungen und zukünftige Fixkosten sind nicht sicher erkannt.</p>':needImport()}
if(k==="invest"){value.textContent=state.holdings.length?state.holdings.length+" Positionen":"–";out='<p>Manuelle Bestandsliste. Kein Depotabruf oder Live-Kurs; ein Gesamtdepotwert wird deshalb nicht angezeigt.</p><div class="fields"><label>Wertpapier / ISIN<input id="security" placeholder="Bezeichnung oder ISIN"></label><label>Stückzahl<input id="shares" inputmode="decimal" placeholder="0"></label><label>Einstand je Stück (€), optional<input id="cost" inputmode="decimal" placeholder="0"></label></div>'+control(["addHolding","Position hinzufügen"])+'<div class="results">'+state.holdings.map((h,i)=>'<div class="line"><span>'+esc(h.name)+'<small> · '+esc(h.shares)+' Stück</small></span><button class="mini" data-remove="'+i+'">Entfernen</button></div>').join("")+'</div>'}
if(k==="lab"){value.textContent=has?state.rows.length+" Buchungen":"Keine Daten";out='<p>CSV-Datei auf diesem Gerät einlesen – ohne Upload zum Server. Die Daten werden nicht dauerhaft gespeichert.</p><label class="import">C24-CSV auswählen<input id="csvfile" type="file" accept=".csv,text/csv"></label><p class="note">Echte Finanzdaten nicht in das öffentliche GitHub-Repository eintragen. Keine verschlüsselte dauerhafte Speicherung, kein automatischer Sync, kein Face ID, keine produktive Freigabe.</p>'+control(["clear","Sitzungsdaten löschen"])}
body.innerHTML=out;document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{state.holdings.splice(Number(b.dataset.remove),1);render("invest")});const file=document.getElementById("csvfile");if(file)file.onchange=async()=>{try{const f=file.files?.[0];if(!f)return;if(f.size>15*1024*1024)throw Error("CSV zu groß (max. 15 MB)");const rows=parseCSV(await f.text());state.rows=rows;state.month=months()[0]||"";state.filter="";render("lab")}catch(e){alert("Import fehlgeschlagen: "+e.message)}}}
function monthControl(){return '<label>Monat<select id="month" aria-label="Monat" onchange="window.cashMonth(this.value)">'+months().map(m=>'<option value="'+esc(m)+'" '+(state.month===m?"selected":"")+'>'+esc(m)+'</option>').join("")+'</select></label>'}
window.cashMonth=m=>{state.month=m;render(state.screen)};
function needImport(){return '<p>Keine Transaktionen geladen. Unter „Mehr“ → Lab kannst du eine C24-CSV ausschließlich lokal importieren.</p>'+control(["lab","Zum Import"])}
document.addEventListener("click",e=>{const b=e.target.closest("[data-action]");if(!b)return;const action=b.dataset.action;
if(action==="lab")return render("lab");
if(action==="balances"){for(const [k,id] of [["C24","bal-c24"],["TR","bal-tr"]]){const raw=document.getElementById(id).value.trim();if(!raw){delete state.balances[k];continue}const n=amount(raw);if(!Number.isFinite(n)){alert("Ungültiger Betrag");return}state.balances[k]=n}return render("cash")}
if(action==="transfers"){state.includeTransfers=!state.includeTransfers;state.month=months().includes(state.month)?state.month:months()[0]||"";return render(state.screen)}
if(action==="find"){state.filter=document.getElementById("txfilter").value;return render("analytics")}
if(action==="clear"){if(!confirm("Alle lokal geladenen Sitzungsdaten löschen?"))return;state.rows=[];state.balances={};state.holdings=[];state.month="";return render("lab")}
if(action==="addHolding"){const name=document.getElementById("security").value.trim(),shares=amount(document.getElementById("shares").value),cost=document.getElementById("cost").value.trim();if(!name||!Number.isFinite(shares)||shares<=0||cost&&!Number.isFinite(amount(cost))){alert("Wertpapier und gültige Stückzahl eingeben");return}state.holdings.push({name,shares,cost:cost?amount(cost):null});return render("invest")}
});
document.querySelectorAll("[data-screen]").forEach(b=>b.addEventListener("click",()=>render(b.dataset.screen)));
document.getElementById("close").addEventListener("click",()=>render("home"));
document.addEventListener("keydown",e=>{if(e.key==="Escape")render("home")});
if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script></body></html>
